  <rect x="210" y="224" width="170" height="22" rx="4" fill="#6366f1"/>
  <!-- Track 2 Audio -->
  <rect x="64" y="252" width="220" height="18" rx="4" fill="#10b981"/>
  <rect x="290" y="252" width="90" height="18" rx="4" fill="#f59e0b"/>

  <text x="430" y="108" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#db2777">Dựng video đa nền tảng</text>
  
  <rect x="414" y="142" width="172" height="74" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="430" y="174" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#c2410c">TIKTOK &amp; REELS</text>

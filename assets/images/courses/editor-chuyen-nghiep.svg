  <text x="74" y="186" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">00:02:45 / 4K 60FPS</text>
  
  <!-- Timeline tracks -->
  <rect x="54" y="214" width="340" height="92" rx="8" fill="#1e293b"/>

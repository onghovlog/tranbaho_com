  <text x="430" y="86" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#c2410c">SỰ KIỆN &amp; ADS</text>
  <text x="430" y="108" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ea580c">Ấn phẩm truyền thông</text>
  
  <rect x="414" y="142" width="172" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="430" y="174" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#1e40af">SOCIAL BRAND</text>
  <text x="430" y="196" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#2563eb">Xây dựng trang cá nhân</text>
  
  <rect x="414" y="230" width="172" height="76" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="430" y="262" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#15803d">PORTFOLIO KHỦNG</text>

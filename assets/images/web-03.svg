<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#f8f9fb"/>
  <!-- Browser Frame -->
  <rect x="25" y="25" width="550" height="350" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="25" y="25" width="550" height="36" rx="10" fill="#f8f9fb"/>
  <line x1="25" y1="61" x2="575" y2="61" stroke="#e5e7eb"/>
  <circle cx="45" cy="43" r="4" fill="#f58220"/>
  <circle cx="58" cy="43" r="4" fill="#1877f2"/>
  <circle cx="71" cy="43" r="4" fill="#10b981"/>
  <rect x="100" y="35" width="220" height="16" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="115" y="46" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#6b7280">https://vinhgroup.com.vn</text>

  <!-- Corporate Site -->
  <g transform="translate(45, 75)">
    <!-- Header -->
    <rect width="510" height="30" rx="4" fill="#f8f9fb"/>
    <text x="20" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#1877f2">VINH CORP</text>
    <text x="160" y="20" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#6b7280">VỀ CHÚNG TÔI · DỰ ÁN · NĂNG LỰC · TIN TỨC · LIÊN HỆ</text>
    
    <!-- Hero Slider -->
    <rect y="40" width="510" height="120" rx="8" fill="#1e293b"/>
    <text x="30" y="80" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#ffffff">GIẢI PHÁP TỔNG THẦU XÂY DỰNG &amp; KIẾN TRÚC</text>
    <text x="30" y="105" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Hơn 15 năm kiến tạo không gian sống và công trình công nghiệp hiện đại</text>
    <rect x="30" y="120" width="110" height="24" rx="4" fill="#1877f2"/>
    <text x="45" y="136" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff">HỒ SƠ NĂNG LỰC</text>

    <!-- 3 Projects Grid -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="160" height="90" rx="6" fill="#f8f9fb" stroke="#e5e7eb"/>
      <rect x="10" y="10" width="140" height="45" rx="4" fill="#e2e8f0"/>
      <text x="10" y="70" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#1f2937">Toà Nhà Văn Phòng Landmark</text>

      <rect x="175" y="0" width="160" height="90" rx="6" fill="#f8f9fb" stroke="#e5e7eb"/>
      <rect x="185" y="10" width="140" height="45" rx="4" fill="#e2e8f0"/>
      <text x="185" y="70" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#1f2937">Khu Nghỉ Dưỡng Sky Villa</text>

      <rect x="350" y="0" width="160" height="90" rx="6" fill="#f8f9fb" stroke="#e5e7eb"/>
      <rect x="360" y="10" width="140" height="45" rx="4" fill="#e2e8f0"/>
      <text x="360" y="70" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#1f2937">Nhà Máy Thông Minh Eco</text>
    </g>
  </g>

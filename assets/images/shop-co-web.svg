<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <filter id="boxShadow" x="-10" y="-10" width="620" height="470" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#1f2937" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="16" fill="#ffffff" stroke="#f58220" stroke-width="1.5"/>
  
  <!-- Left Side: Social Media Chaos / Limitations -->
  <g transform="translate(40, 50)">
    <rect width="230" height="350" rx="12" fill="#f8f9fb" stroke="#e5e7eb"/>
    <text x="20" y="35" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#6b7280">BÁN QUA MẠNG XÃ HỘI</text>
    
    <rect x="20" y="55" width="190" height="50" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="35" y="77" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ef4444">⚠️ Trôi bài &amp; mất tin nhắn</text>
    <text x="35" y="93" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#6b7280">Khách khó tìm lại sản phẩm cũ</text>

    <rect x="20" y="115" width="190" height="50" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="35" y="137" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ef4444">⚠️ Phụ thuộc thuật toán</text>
    <text x="35" y="153" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#6b7280">Dễ bị bóp tương tác, khoá page</text>

    <rect x="20" y="175" width="190" height="50" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="35" y="197" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ef4444">⚠️ Thiếu tính chuyên nghiệp</text>
    <text x="35" y="213" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#6b7280">Khách phân vân về uy tín</text>
    
    <rect x="20" y="240" width="190" height="85" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="35" y="268" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#991b1b">Không có địa chỉ riêng</text>
    <text x="35" y="288" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#7f1d1d">Mất khách quen khi đổi nền tảng</text>
  </g>

  <!-- Transformation Arrow in Center -->
  <g transform="translate(285, 200)">
    <circle cx="15" cy="15" r="22" fill="#fff7ed" stroke="#f58220" stroke-width="2"/>
    <path d="M7 15H23M17 9L23 15L17 21" stroke="#f58220" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Side: Shop Co Web Solution -->
  <g transform="translate(330, 50)" filter="url(#boxShadow)">
    <rect width="230" height="350" rx="12" fill="#ffffff" stroke="#f58220" stroke-width="2"/>
    <rect width="230" height="42" rx="12" fill="#fff7ed"/>
    <text x="20" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#f58220">✨ GIẢI PHÁP SHOP CÓ WEB</text>
    
    <rect x="20" y="55" width="190" height="50" rx="8" fill="#f8f9fb" stroke="#e5e7eb"/>
    <text x="35" y="77" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#10b981">✓ Tên miền &amp; Thương hiệu riêng</text>
    <text x="35" y="93" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#6b7280">Ghi nhớ lâu dài, khẳng định uy tín</text>

    <rect x="20" y="115" width="190" height="50" rx="8" fill="#f8f9fb" stroke="#e5e7eb"/>
    <text x="35" y="137" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#10b981">✓ Danh mục sản phẩm rõ ràng</text>
    <text x="35" y="153" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#6b7280">Xem ảnh, giá, chi tiết trong 1 giây</text>

    <rect x="20" y="175" width="190" height="50" rx="8" fill="#f8f9fb" stroke="#e5e7eb"/>
    <text x="35" y="197" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#10b981">✓ Kết nối Zalo / Hotline 1 chạm</text>
    <text x="35" y="213" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#6b7280">Khách chốt đơn ngay không cần đợi</text>
    
    <rect x="20" y="240" width="190" height="85" rx="8" fill="#fff7ed" stroke="#f58220"/>
    <text x="35" y="268" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#f58220">Tối ưu trên di động</text>
    <text x="35" y="288" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#4b5563">Gắn bio TikTok, Reels, Facebook siêu mượt</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <filter id="dropShadow" x="-10" y="-10" width="620" height="470" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#1f2937" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="16" fill="#f8f9fb" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Droppii Ecosystem Grid -->
  <g transform="translate(40, 40)">
    <!-- Top Banner -->
    <rect width="520" height="70" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="35" cy="35" r="18" fill="#fff7ed"/>
    <text x="25" y="42" font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="#f58220">D</text>
    <text x="65" y="32" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#1f2937">Mô Hình Kinh Doanh Tinh Gọn Droppii</text>
    <text x="65" y="52" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#6b7280">Không vốn ôm hàng · Không đóng gói ship hàng · Đào tạo 1-1 từ A-Z</text>

    <!-- 3 Core Pillars -->
    <!-- Pillar 1 -->
    <g transform="translate(0, 90)" filter="url(#dropShadow)">
      <rect width="160" height="240" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="15" y="15" width="40" height="40" rx="8" fill="#fff7ed"/>
      <text x="25" y="40" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#f58220">01</text>
      <text x="15" y="80" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#1f2937">3.000+ Sản Phẩm</text>
      <text x="15" y="102" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500" fill="#6b7280">Hàng chính hãng, chất lượng cao, đa dạng từ chăm sóc sức khoẻ, sắc đẹp, tiện ích gia đình.</text>
      <rect x="15" y="195" width="130" height="28" rx="6" fill="#f8f9fb" stroke="#e5e7eb"/>
      <text x="35" y="213" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#f58220">HỆ SINH THÁI CHUẨN</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(180, 90)" filter="url(#dropShadow)">
      <rect width="160" height="240" rx="10" fill="#ffffff" stroke="#f58220" stroke-width="1.5"/>
      <rect x="15" y="15" width="40" height="40" rx="8" fill="#eff6ff"/>
      <text x="25" y="40" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#1877f2">02</text>
      <text x="15" y="80" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#1f2937">Ứng Dụng &amp; Vận Hành</text>
      <text x="15" y="102" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500" fill="#6b7280">Quản lý đơn hàng, hoa hồng, theo dõi vận chuyển tự động hoá 100% trên điện thoại.</text>
      <rect x="15" y="195" width="130" height="28" rx="6" fill="#eff6ff"/>
      <text x="38" y="213" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#1877f2">CÔNG NGHỆ 4.0</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(360, 90)" filter="url(#dropShadow)">
      <rect width="160" height="240" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="15" y="15" width="40" height="40" rx="8" fill="#f0fdf4"/>
      <text x="25" y="40" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#10b981">03</text>
      <text x="15" y="80" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#1f2937">Đồng Hành 1 - 1</text>
      <text x="15" y="102" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500" fill="#6b7280">Được hướng dẫn trực tiếp từ tôi: chiến lược sản phẩm, xây dựng website bán hàng, tư vấn khách.</text>
      <rect x="15" y="195" width="130" height="28" rx="6" fill="#f0fdf4"/>
      <text x="35" y="213" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#10b981">HỖ TRỢ TẬN TÂM</text>
    </g>
  </g>
</svg>

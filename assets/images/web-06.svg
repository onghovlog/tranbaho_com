    <text x="30" y="40" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#f58220">SIÊU THỊ TIỆN ÍCH DROPPII ONLINE</text>
    <text x="30" y="62" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#4b5563">Hơn 3.000 sản phẩm chăm sóc sức khỏe &amp; đồ gia dụng thông minh chính hãng</text>
    <rect x="30" y="70" width="100" height="15" rx="3" fill="#1877f2"/>
    <text x="38" y="81" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#ffffff">FREESHIP TOÀN QUỐC</text>

    <!-- Categories Grid -->
    <g transform="translate(0, 105)">

      <circle cx="60" cy="45" r="22" fill="#fff7ed"/>
      <text x="60" y="52" font-family="'Inter', sans-serif" font-size="16" text-anchor="middle">🍎</text>
      <text x="60" y="90" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#1f2937" text-anchor="middle">Sức Khoẻ</text>
      <text x="60" y="110" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#6b7280" text-anchor="middle">500+ SP</text>

      <rect x="130" y="0" width="120" height="150" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
      <circle cx="190" cy="45" r="22" fill="#eff6ff"/>
      <text x="190" y="52" font-family="'Inter', sans-serif" font-size="16" text-anchor="middle">✨</text>
      <text x="190" y="90" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#1f2937" text-anchor="middle">Làm Đẹp</text>
      <text x="190" y="110" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#6b7280" text-anchor="middle">800+ SP</text>

      <rect x="260" y="0" width="120" height="150" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
      <circle cx="320" cy="45" r="22" fill="#f0fdf4"/>
      <text x="320" y="52" font-family="'Inter', sans-serif" font-size="16" text-anchor="middle">🏠</text>
      <text x="320" y="90" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#1f2937" text-anchor="middle">Gia Dụng</text>
      <text x="320" y="110" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#6b7280" text-anchor="middle">450+ SP</text>

      <rect x="390" y="0" width="120" height="150" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
      <circle cx="450" cy="45" r="22" fill="#faf5ff"/>
      <text x="450" y="52" font-family="'Inter', sans-serif" font-size="16" text-anchor="middle">👶</text>
      <text x="450" y="90" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#1f2937" text-anchor="middle">Mẹ &amp; Bé</text>
      <text x="450" y="110" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#6b7280" text-anchor="middle">300+ SP</text>

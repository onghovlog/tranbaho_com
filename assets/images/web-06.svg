<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#f8f9fb"/>
  <!-- Browser Frame -->
  <rect x="25" y="25" width="550" height="350" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="25" y="25" width="550" height="36" rx="10" fill="#f8f9fb"/>
  <line x1="25" y1="61" x2="575" y2="61" stroke="#e5e7eb"/>
  <circle cx="45" cy="43" r="4" fill="#f58220"/>
  <circle cx="58" cy="43" r="4" fill="#1877f2"/>
  <circle cx="71" cy="43" r="4" fill="#10b981"/>
  <rect x="100" y="35" width="220" height="16" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="115" y="46" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#6b7280">https://sieuthidroppii.online</text>

  <!-- Droppii Store Hub -->
  <g transform="translate(45, 75)">
